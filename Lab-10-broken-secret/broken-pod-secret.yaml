apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
data:
  password: c2F2YWdlY2FtcA==
---
apiVersion: v1
kind: Pod
metadata:
  name: auth-app
spec:
  containers:
  - name: py-app
    image: python:3.9-slim
    command: ["sh", "-c", "echo $DB_PASS && sleep 3600"]
    env:
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: db-password