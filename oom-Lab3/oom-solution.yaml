apiVersion: v1
kind: ConfigMap
metadata:
  name: leaky-app-config
data:
  app.py: |
    import time
    print("SavageCamp App Starting...")
    # This app needs 200Mi to function
    data = bytearray(200 * 1024 * 1024) 
    print("Successfully allocated 200Mi of memory!")
    while True:
        time.sleep(1)
---
apiVersion: v1
kind: Pod
metadata:
  name: custom-memory-hog
spec:
  containers:
  - name: python-worker
    image: python:3.9-slim
    command: ["python", "/mnt/app.py"]
    volumeMounts:
    - name: script-vol
      mountPath: /mnt
    resources:
      requests:
        memory: "200Mi" # Change this to 200Mi
      limits:
        memory: "300Mi" # Limits increased to 300Mi
  volumes:
  - name: script-vol
    configMap:
      name: leaky-app-config